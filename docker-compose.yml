services:
  claude-code-webui:
    build: .
    container_name: claude-code-webui
    restart: unless-stopped
    ports:
      - "8068:8068"
    environment:
      PORT: "8068"
      HOST: "0.0.0.0"
      DATA_DIR: "/app/data"
      WORKSPACE_ROOT: "/workspaces"
      CLAUDE_COMMAND: ""
      CLAUDE_ARGS: ""
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env before starting}"
      SEED_DEMO_USERS: "false"
      MAX_CONCURRENT_TURNS: "4"
      MAX_CONCURRENT_TURNS_PER_TEAM: "2"
      MAX_CONCURRENT_TURNS_PER_USER: "1"
    volumes:
      - claude_data:/app/data
      - claude_workspaces:/workspaces

volumes:
  claude_data:
  claude_workspaces:
