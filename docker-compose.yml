services:
  claude-code-webui:
    build: .
    container_name: claude-code-webui
    restart: unless-stopped
    ports:
      - "8068:8068"
    environment:
      PORT: "8068"
      HOST: "0.0.0.0"
      DATA_DIR: "/app/data"
      BACKUP_ENABLED: "${BACKUP_ENABLED:-true}"
      BACKUP_DIR: "/app/data/backups"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
      BACKUP_RETENTION: "${BACKUP_RETENTION:-14}"
      WORKSPACE_ROOT: "/workspaces"
      CLAUDE_COMMAND: ""
      CLAUDE_ARGS: "${CLAUDE_ARGS:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env before starting}"
      SEED_DEMO_USERS: "${SEED_DEMO_USERS:-false}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SESSION_TTL_MS: "${SESSION_TTL_MS:-43200000}"
      MAX_BODY_SIZE: "${MAX_BODY_SIZE:-2097152}"
      MAX_CONCURRENT_TURNS: "${MAX_CONCURRENT_TURNS:-4}"
      MAX_CONCURRENT_TURNS_PER_TEAM: "${MAX_CONCURRENT_TURNS_PER_TEAM:-2}"
      MAX_CONCURRENT_TURNS_PER_USER: "${MAX_CONCURRENT_TURNS_PER_USER:-1}"
      MODEL_CONTEXT_TOKENS: "${MODEL_CONTEXT_TOKENS:-1000000}"
      AUTO_COMPACT_RATIO: "${AUTO_COMPACT_RATIO:-0.62}"
      AUTO_COMPACT_ENABLED: "${AUTO_COMPACT_ENABLED:-true}"
      MCP_TOOL_ALLOWLIST: "${MCP_TOOL_ALLOWLIST:-}"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:-}"
      MAXCOMPUTE_ENABLED: "${MAXCOMPUTE_ENABLED:-false}"
      MAXCOMPUTE_PROJECT: "${MAXCOMPUTE_PROJECT:-}"
      MAXCOMPUTE_COMMAND: "${MAXCOMPUTE_COMMAND:-odpscmd}"
      MAXCOMPUTE_ARGS: "${MAXCOMPUTE_ARGS:-}"
      MAXCOMPUTE_SCHEDULE_TIME: "${MAXCOMPUTE_SCHEDULE_TIME:-06:15}"
    volumes:
      - claude_data:/app/data
      - claude_workspaces:/workspaces

volumes:
  claude_data:
  claude_workspaces:
